[package]
name = "contextpilot"
version = "0.1.0"
edition = "2021"
description = "Local context router and output optimizer"
license = "MIT"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
walkdir = "2"
